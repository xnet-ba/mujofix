name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: System libs for Qt (PySide6 offscreen)
        run: sudo apt-get update &&
             sudo apt-get install -y libegl1 libgl1 libxkbcommon0
             libfontconfig1 libdbus-1-3
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q mujofix tests scripts
      - name: Unit tests
        run: env QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Unit tests (mockovani, ali prolaze kroz realan winreg path)
        run: python -m unittest discover -s tests
      - name: Zivi scan na pravom Windowsu (Server kernel, realan API)
        run: |
          $env:PYTHONPATH = "mujofix"
          python -m mujofix.cli scan --summary
          python -m mujofix.cli scan --out findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-live-findings
          path: findings.json

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller build (isti spec kao release)
        run: python -m PyInstaller mujofix.spec
      - name: Placeholder za OpenCode (u release-u ga puni tag job)
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/opencode | Out-Null
          Set-Content build/opencode/PLACEHOLDER.txt "CI validacija: pravi OpenCode ide u release job-u"
      - name: Inno Setup (kompajliraj installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = python -c "import re;print(re.search(r'## \[(\d+\.\d+\.\d+)\]', open('CHANGELOG.md',encoding='utf-8').read()).group(1))"
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $iss = 'installer\mujofix.iss'
          $bs = $false
          if ($iscc) {
            $bs = Test-Path (Join-Path (Split-Path $iscc) 'Languages\Bosnian.isl')
            if (-not $bs) {
              $txt = Get-Content $iss -Raw
              $txt = [regex]::Replace($txt, '(?ms)^\[Languages\].*?(?=^\[)', '')
              $iss = 'installer\mujofix_ci.iss'
              Set-Content $iss $txt -Encoding UTF8
            }
          }
          Write-Output "ISCC=$iscc VER=$ver BOSNIAN=$bs ISS=$iss"
          if (-not $iscc) { Write-Output "::error::ISCC.exe nije nadjen"; throw "ISCC missing" }
          $out = & $iscc "/DMyAppVersion=$ver" $iss 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            $flat = ($out -replace "\r?\n", ' | ')
            Write-Output "::error::ISCC exit $LASTEXITCODE BOSNIAN=$bs :: $flat"
            throw "ISCC failed"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MujoFix-installer
          path: installer/Output/*.exe

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Provjeri OpenCode pin (SHA mora biti popunjen)
        shell: pwsh
        run: |
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          if (-not $sha -or $sha -match 'NE PROVJERENO') {
            throw 'OPENCODE_PIN.txt nije popunjen - build prekinut' }
      - name: Preuzmi i provjeri OpenCode (pinovan, SHA-256)
        shell: pwsh
        run: |
          $url = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^URL=' }) -split '=', 2)[1]
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          $zip = "$env:RUNNER_TEMP\opencode.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sha.ToLower()) { throw "SHA MISMATCH: $hash" }
          New-Item -ItemType Directory build/opencode | Out-Null
          Expand-Archive $zip build/opencode
      - run: python -m PyInstaller mujofix.spec
      - name: Ubaci pinovani OpenCode u dist (kao installer)
        shell: pwsh
        run: Copy-Item build/opencode dist/MujoFix/opencode -Recurse
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            Format-Table -AutoSize |
            Out-File $env:RUNNER_TEMP/SHA256SUMS.txt
          Move-Item $env:RUNNER_TEMP/SHA256SUMS.txt dist/SHA256SUMS.txt
      - name: Smoke test bundlovanog CLI-ja (pravi Win exe)
        shell: pwsh
        run: |
          .\dist\MujoFix\MujoFixCLI.exe scan --summary
          if ($LASTEXITCODE -ne 0) { throw "bundlovani CLI pao" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MujoFix-windows
          path: dist/
      - name: Zapakuj dist za release
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "MujoFix-$env:GITHUB_REF_NAME.zip"
      - name: Objavi GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            --title "MujoFix $env:GITHUB_REF_NAME" `
            --generate-notes `
            "MujoFix-$env:GITHUB_REF_NAME.zip" dist\SHA256SUMS.txt
