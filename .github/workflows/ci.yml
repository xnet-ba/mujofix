name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libs for Qt (PySide6 offscreen)
        run: sudo apt-get update &&
             sudo apt-get install -y libegl1 libgl1 libxkbcommon0
             libfontconfig1 libdbus-1-3
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q mujofix tests scripts
      - name: Unit tests
        run: env QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Unit tests (mockovani, ali prolaze kroz realan winreg path)
        run: python -m unittest discover -s tests

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Provjeri OpenCode pin (SHA mora biti popunjen)
        shell: pwsh
        run: |
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          if (-not $sha -or $sha -match 'NE PROVJERENO') {
            throw 'OPENCODE_PIN.txt nije popunjen - build prekinut' }
      - name: Preuzmi i provjeri OpenCode (pinovan, SHA-256)
        shell: pwsh
        run: |
          $url = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^URL=' }) -split '=', 2)[1]
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          $zip = "$env:RUNNER_TEMP\opencode.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sha.ToLower()) { throw "SHA MISMATCH: $hash" }
          New-Item -ItemType Directory build/opencode | Out-Null
          Expand-Archive $zip build/opencode
      - run: python -m PyInstaller mujofix.spec
      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            Format-Table -AutoSize |
            Out-File $env:RUNNER_TEMP/SHA256SUMS.txt
          Move-Item $env:RUNNER_TEMP/SHA256SUMS.txt dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MujoFix-windows
          path: dist/
