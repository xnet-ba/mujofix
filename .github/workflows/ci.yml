name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: System libs for Qt (PySide6 offscreen)
        run: sudo apt-get update &&
             sudo apt-get install -y libegl1 libgl1 libxkbcommon0
             libfontconfig1 libdbus-1-3
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q mujofix tests scripts
      - name: Unit tests
        run: env QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install UI deps
        run: pip install -r requirements.txt
      - name: Unit tests (mockovani, ali prolaze kroz realan winreg path)
        run: python -m unittest discover -s tests
      - name: Zivi scan na pravom Windowsu (Server kernel, realan API)
        run: |
          $env:PYTHONPATH = "mujofix"
          python -m mujofix.cli scan --summary
          python -m mujofix.cli scan --out findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-live-findings
          path: findings.json

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller build (isti spec kao release)
        run: python -m PyInstaller mujofix.spec
      - name: Smoke test — zapakovani exe stvarno radi (scan + update)
        shell: pwsh
        run: |
          # Do sada se dist samo kompajlirao — ovdje DOKAZUJEMO da exe radi:
          # scan (skeneri + i18n + model nalaza) i update (mreza + verzija).
          $exe = "dist\MujoFix\MujoFixCLI.exe"
          if (-not (Test-Path $exe)) {
            Write-Output "::error::nema $exe"; throw "exe missing"
          }
          # --lang en: stabilan izlaz za provjeru (i testira --lang na Win exe-u)
          $scan = & $exe scan --lang en --summary 2>&1 | Out-String
          Write-Output $scan
          if ($LASTEXITCODE -ne 0) {
            $tail = (($scan -split "\r?\n") | Select-Object -Last 8) -join " | "
            Write-Output "::error::frozen scan exit $LASTEXITCODE :: $tail"
            throw "frozen scan failed"
          }
          if ($scan -notmatch "problems") {
            Write-Output "::error::scan nije dao sazetak :: $scan"
            throw "no summary"
          }
          $upd = & $exe update 2>&1 | Out-String
          Write-Output $upd
          if ($LASTEXITCODE -ne 0) {
            # Cilj je da exe NE PUKNE. Mreza/rate-limit GitHub API-ja je
            # okolnost runner-a (403 rate limit se vec desio) — app to mora
            # uredno prijaviti, pa to nije pad build-a. Traceback jeste.
            if ($upd -match "Traceback") {
              Write-Output "::error::frozen update crash :: $upd"
              throw "frozen update crashed"
            }
            Write-Output "::warning::frozen update nije mogao provjeriti (mreza/rate limit) — prihvaceno, nema tracebacka"
          }
      - name: Inno Setup (kompajliraj installer)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = python -c "import re;print(re.search(r'## \[(\d+\.\d+\.\d+)\]', open('CHANGELOG.md',encoding='utf-8').read()).group(1))"
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          Write-Output "ISCC=$iscc VER=$ver"
          if (-not $iscc) { Write-Output "::error::ISCC.exe nije nadjen"; throw "ISCC missing" }
          $out = & $iscc "/DMyAppVersion=$ver" "installer\mujofix.iss" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            $flat = ($out -replace "\r?\n", ' | ')
            Write-Output "::error::ISCC exit $LASTEXITCODE :: $flat"
            throw "ISCC failed"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MujoFix-installer
          path: installer/Output/*.exe

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller
      - name: Provjeri OpenCode pin (SHA mora biti popunjen)
        shell: pwsh
        run: |
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          if (-not $sha -or $sha -match 'NE PROVJERENO') {
            throw 'OPENCODE_PIN.txt nije popunjen - build prekinut' }
      - name: Preuzmi i provjeri OpenCode (pinovan, SHA-256)
        shell: pwsh
        run: |
          $url = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^URL=' }) -split '=', 2)[1]
          $sha = ((Get-Content installer/OPENCODE_PIN.txt |
                   Where-Object { $_ -match '^SHA256_WINDOWS_X64=' }) -split '=', 2)[1]
          $zip = "$env:RUNNER_TEMP\opencode.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $sha.ToLower()) { throw "SHA MISMATCH: $hash" }
          New-Item -ItemType Directory build/opencode | Out-Null
          Expand-Archive $zip build/opencode
      - run: python -m PyInstaller mujofix.spec
      - name: Ubaci pinovani OpenCode u dist (za installer i zip)
        shell: pwsh
        run: |
          Copy-Item build/opencode dist/MujoFix/opencode -Recurse
          Copy-Item installer/OPENCODE_PIN.txt dist/MujoFix/opencode/
      - name: Smoke test bundlovanog CLI-ja (pravi Win exe)
        shell: pwsh
        run: |
          .\dist\MujoFix\MujoFixCLI.exe scan --summary
          if ($LASTEXITCODE -ne 0) { throw "bundlovani CLI pao" }
      - name: Inno Setup installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = python -c "import re;print(re.search(r'## \[(\d+\.\d+\.\d+)\]', open('CHANGELOG.md',encoding='utf-8').read()).group(1))"
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = (Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $out = & $iscc "/DMyAppVersion=$ver" "installer\mujofix.iss" 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::$out"; throw "ISCC failed" }
      - name: SHA-256 checksums (sha256sum format)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Recurse -File) + @(Get-ChildItem installer/Output -File -Filter *.exe)
          $files | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MujoFix-windows
          path: |
            dist/
            installer/Output/
      - name: Zapakuj dist za release
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath "MujoFix-$env:GITHUB_REF_NAME.zip"
      - name: Objavi GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = (Get-ChildItem 'installer/Output' -Filter *.exe | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" `
            --title "MujoFix $env:GITHUB_REF_NAME" `
            --generate-notes `
            "MujoFix-$env:GITHUB_REF_NAME.zip" `
            $setup `
            dist\SHA256SUMS.txt
